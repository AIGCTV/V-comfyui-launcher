name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-audit:
    name: secret-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test scripts/security-audit.test.cjs
      - run: node scripts/security-audit.cjs source
      - run: node scripts/security-audit.cjs history
